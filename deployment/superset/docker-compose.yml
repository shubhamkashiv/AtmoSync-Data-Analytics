

services:
  db:
    image: postgres:17
    container_name: atmosync_superset_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - superset_db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: atmosync_superset_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  superset-init:
    image: atmosync-superset:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atmosync_superset_init
    command: ["/app/docker/docker-init.sh"]
    restart: "no"
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: "root"

  superset:
    image: atmosync-superset:local
    container_name: atmosync_superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    ports:
      - "${SUPERSET_PORT:-8090}:8090"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"

  superset-worker:
    healthcheck:
      disable: true
    image: atmosync-superset:local
    container_name: atmosync_superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath
      CELERYD_CONCURRENCY: 2
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"

  superset-worker-beat:
    healthcheck:
      disable: true
    image: atmosync-superset:local
    container_name: atmosync_superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"

volumes:
  superset_db:
  redis_data:
  superset_home:

